# Tooling configuration only (this project is run from source, not packaged).
[tool.pytest.ini_options]
testpaths = ["tests"]
# The e2e tree needs Docker and a live Gramps Web instance, so it must never run in a plain
# `pytest -q`. Two things keep it out: this deselection, and tests/e2e/conftest.py stamping
# the marker on every item it collects — so a test that forgets the marker is still gated.
addopts = "-m 'not e2e'"
markers = [
  "e2e: needs Docker and a disposable Gramps Web instance (auto-stamped under tests/e2e)",
  "gramps: brings up a live Gramps Web instance, not merely Docker — the required CI leg runs `-m 'e2e and not gramps'` and must stay free of services",
  "refusal: negative or error-text case — nightly only; highest rot, least signal per second",
  "upstream_pin: grades Gramps Web rather than this repo — excluded from the floating-digest leg",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = flake8-bugbear, UP = pyupgrade.
select = ["E", "F", "I", "W", "B", "UP"]
# Line length is enforced by the formatter, not the linter, so long string/
# comment lines the formatter can't split don't fail the lint gate.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally group an error-class import with the test section that
# uses it, rather than hoisting every name to a single top-of-file block.
"tests/*" = ["E402"]

[tool.ruff.format]
# black-compatible defaults.
