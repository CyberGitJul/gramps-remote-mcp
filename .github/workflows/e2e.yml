# Generated by OrchestKit Claude Plugin
# Created: 2026-08-01

name: e2e

# Two legs, deliberately unequal.
#
# `image-contract` is **required**. It runs everything that needs at most Docker: the handshake,
# the pinned tool contract, the environment wiring, the destructive gate's fail-open probe and
# the in-image import (D19). No Gramps Web, no Redis, no credentials, no secrets — so there is
# nothing in it that can be flaky for a reason that is not a defect. It covers the failure this
# repository has actually shipped twice: a module missing from the Dockerfile's COPY list, which
# builds fine and dies on the first spawn.
#
# `stage1` brings up a real Gramps Web instance and is **advisory** (`continue-on-error`). It is
# advisory because nobody has yet watched it run: a required check that turns red for an image
# pull or a slow bring-up teaches people to ignore red checks, which is worse than not having it.
# **Promotion rule, so it does not stay advisory by inertia:** after 20 consecutive runs whose
# only failures were genuine, delete the `continue-on-error` line and add it to the ruleset.
#
# `nightly` is the only job that runs `-m e2e` whole. That is what "nightly only" means for
# `@pytest.mark.refusal`: the negative and error-text cases run here and nowhere else.
#
# Stage 2 (the real-model leg) is deliberately absent. It costs money per run and is triggered by
# hand — see tests/e2e/stage2/.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, off the hour: the runner queue is shorter and the Gramps Web image is pulled
    # fresh, which is itself part of what the nightly is for.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-contract:
    name: image-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Builds the working-tree image once (the `mcp_image` fixture, D8's default leg) and runs
      # every test that needs no services. The marker is linted by test_00_ci_legs.py, so a new
      # module cannot quietly drag an instance bring-up into this job.
      #
      # `not refusal` is redundant here today — every refusal case lives in a `gramps`-marked
      # matrix — and is written anyway so the marker means one thing in all three jobs: not on a
      # pull request. A negative case cheap enough for this leg simply does not carry it.
      - name: Docker-only e2e leg
        run: pytest tests/e2e -m "e2e and not gramps and not refusal" -q

      - name: Reap anything left standing
        if: always()
        run: pytest --e2e-reap-only --e2e-force

  stage1:
    name: stage1 (advisory)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Pulled explicitly rather than on first use: a pull that fails inside a fixture reads as
      # "the instance did not come up", and that is the diagnosis this job exists to make
      # trustworthy.
      - name: Pull the service images
        run: |
          docker pull ghcr.io/gramps-project/grampsweb:latest
          docker pull redis:alpine

      # Minus the refusal cases: negative and error-text assertions carry the highest rot and
      # the least signal per second, so they run once a night rather than on every push. The
      # marker is linted both ways by test_00_refusal_marker.py — it takes a test off this leg,
      # which is the one kind of annotation that cannot be left to good intentions.
      - name: Full e2e suite
        run: pytest tests/e2e -m "e2e and not refusal" -q

      - name: Reap anything left standing
        if: always()
        run: pytest --e2e-reap-only --e2e-force

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  nightly:
    name: nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Pull the service images
        run: |
          docker pull ghcr.io/gramps-project/grampsweb:latest
          docker pull redis:alpine

      # One leg today. The second — the *released* artifact via GRAMPS_E2E_IMAGE_LEG=released —
      # needs `gramps-remote-mcp:latest` to exist on the runner, and this repository publishes
      # its images locally rather than to a registry. Adding it means building from the latest
      # tag first; it is listed here rather than silently omitted.
      - name: Full e2e suite
        run: pytest tests/e2e -m e2e -q

      - name: Reap anything left standing
        if: always()
        run: pytest --e2e-reap-only --e2e-force

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-${{ github.run_id }}
          path: .e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 30
